name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The document store is tested against a real database rather than a fake,
    # so the workflow brings one up.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://gym:gym@localhost:5432/gym_tracker
      BETTER_AUTH_SECRET: secret-for-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test:ci
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two pushes in a row must not run docker compose up on the host at once,
    # and a started deploy is let finish rather than cut off halfway.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            deployed:
              - src/server/**
              - prisma/**
              - prisma.config.ts
              - package.json
              - package-lock.json
              - landing/**
              - Dockerfile
              - .dockerignore
              - docker-compose.*.yml
              - deploy.sh
              - .env.prod
              - .github/workflows/ci.yml

      - name: Create .env.keys
        if: steps.changes.outputs.deployed == 'true'
        run: printf '%s\n' "${{ secrets.DOTENV_KEYS }}" > .env.keys

      - name: Install dotenvx
        if: steps.changes.outputs.deployed == 'true'
        run: curl -sfS https://dotenvx.sh | sh

      - name: Set up SSH
        if: steps.changes.outputs.deployed == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          DOMAIN_NAME=$(grep '^DOMAIN_NAME=' .env.prod | cut -d= -f2-)
          ssh-keyscan -H "$DOMAIN_NAME" >> ~/.ssh/known_hosts

      - name: Deploy
        if: steps.changes.outputs.deployed == 'true'
        run: ./deploy.sh prod
