<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Workout finish</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font: inherit; }
  html { font-family: Montserrat, "Segoe UI", "Helvetica Neue", sans-serif; background:#111; color:#fff; -webkit-font-smoothing:antialiased; }
  body { padding:24px; display:flex; flex-wrap:wrap; gap:20px; width:2093px; align-items:flex-start; }

  .col { display:flex; flex-direction:column; gap:10px; width:393px; flex:0 0 auto; }
  .caption { font-size:12px; color:#8b9299; line-height:1.5; height:74px; }
  .caption b { color:#fff; font-weight:600; display:block; font-size:13px; margin-bottom:3px; }
  .rowTitle { width:100%; font-size:12px; color:#5f6a72; letter-spacing:.14em; text-transform:uppercase; padding:6px 0 0; }

  .phone { width:393px; height:800px; background:#000; border-radius:26px; overflow:hidden;
           display:flex; flex-direction:column; border:1px solid #2a2a2a; position:relative; }

  .top { display:flex; align-items:center; padding:10px 14px 10px 8px; flex:0 0 auto; }
  .ghostBtn { width:40px; height:40px; display:flex; align-items:center; justify-content:center;
              border:none; background:transparent; color:#6d6d6d; font-size:19px; }
  .clock { margin-left:auto; font-size:13px; color:#6d6d6d; font-variant-numeric:tabular-nums; }

  .sum { flex:1 1 0; overflow:hidden; display:flex; flex-direction:column; }
  .sumTop { text-align:center; padding:6px 24px 0; }
  .sumTitle { font-size:24px; font-weight:700; }
  .sumSub { font-size:13px; color:#7a7a7a; margin-top:7px; }
  .sumName { font-size:14px; color:#6d8ba8; margin-top:3px; }

  .figures { display:flex; justify-content:center; gap:18px; margin-top:12px; }
  .figCap { text-align:center; font-size:10px; color:#5a5a5a; letter-spacing:.1em; text-transform:uppercase; margin-top:4px; }
  .skin { fill:#191919; }

  /* ---- the three ramps under comparison ---- */
  /* fill paints the SVG regions, background paints the legend swatches */
  .mono .lv0 { fill:#232323; } .mono .lv1 { fill:#4a4a4a; } .mono .lv2 { fill:#8d8d8d; } .mono .lv3 { fill:#f0f0f0; }
  .warm .lv0 { fill:#232323; } .warm .lv1 { fill:#463619; } .warm .lv2 { fill:#a06a22; } .warm .lv3 { fill:#ffb340; }
  .loud .lv0 { fill:#3a3a3a; } .loud .lv1 { fill:#22d3c5; } .loud .lv2 { fill:#ff9f2e; } .loud .lv3 { fill:#ff3b30; }
  .mono .scale i.lv1 { background:#4a4a4a; } .mono .scale i.lv2 { background:#8d8d8d; } .mono .scale i.lv3 { background:#f0f0f0; }
  .warm .scale i.lv1 { background:#463619; } .warm .scale i.lv2 { background:#a06a22; } .warm .scale i.lv3 { background:#ffb340; }
  .loud .scale i.lv1 { background:#22d3c5; } .loud .scale i.lv2 { background:#ff9f2e; } .loud .scale i.lv3 { background:#ff3b30; }

  .scale { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:10px;
           font-size:10px; color:#5a5a5a; letter-spacing:.06em; }
  .scale i { width:22px; height:5px; border-radius:2px; display:block; }

  .nums { display:flex; margin-top:14px; padding:0 16px; }
  .num { flex:1 1 0; text-align:center; }
  .numV { font-size:21px; font-weight:600; font-variant-numeric:tabular-nums; }
  .numL { font-size:10px; color:#6d6d6d; letter-spacing:.1em; text-transform:uppercase; margin-top:5px; }

  .sec { padding:20px 16px 0; }
  .secTitle { font-size:10px; color:#5f6a72; letter-spacing:.14em; text-transform:uppercase; }
  .ev { display:flex; gap:10px; align-items:flex-start; margin-top:10px; font-size:13px; line-height:1.45; }
  .ev .icn { flex:0 0 16px; color:#FF0; margin-top:1px; }
  .ev .icn.up { color:#0B0; font-size:12px; }
  .ev b { font-weight:600; }
  .ev span { color:#a8a8a8; }
  .next { margin-top:10px; font-size:13px; line-height:1.5; color:#a8a8a8; }
  .next b { color:#fff; font-weight:600; }
  .next div { margin-top:7px; }
  .warnBox { margin:18px 16px 0; border:1px solid #4a3a1e; background:#241d0f; border-radius:12px;
             padding:12px 14px; font-size:12px; color:#e8d9a8; line-height:1.5; }

  .sumAct { flex:0 0 auto; padding:14px 24px 14px; }
  .save { width:100%; border:none; border-radius:16px; background:#0B0; color:#fff;
          font-size:18px; font-weight:700; padding:20px; }
  .again { width:100%; background:transparent; border:none; color:#7a7a7a; font-size:13px; padding:14px 0 4px; }
</style>
</head>
<body>
<script>
// front: traps delts chest biceps forearms abs quads calves
function front(l) { return `
<svg width="96" height="176" viewBox="0 0 100 185">
  <circle cx="50" cy="15" r="9" class="skin"/>
  <rect x="42" y="25" width="16" height="7" rx="3" class="lv${l.traps||0}"/>
  <ellipse cx="27" cy="43" rx="9" ry="8" class="lv${l.delts||0}"/><ellipse cx="73" cy="43" rx="9" ry="8" class="lv${l.delts||0}"/>
  <rect x="35" y="36" width="14" height="20" rx="5" class="lv${l.chest||0}"/><rect x="51" y="36" width="14" height="20" rx="5" class="lv${l.chest||0}"/>
  <rect x="19" y="53" width="9" height="23" rx="4" class="lv${l.biceps||0}"/><rect x="72" y="53" width="9" height="23" rx="4" class="lv${l.biceps||0}"/>
  <rect x="17" y="78" width="8" height="22" rx="4" class="lv${l.forearms||0}"/><rect x="75" y="78" width="8" height="22" rx="4" class="lv${l.forearms||0}"/>
  <rect x="41" y="58" width="18" height="26" rx="5" class="lv${l.abs||0}"/>
  <rect x="35" y="88" width="13" height="40" rx="6" class="lv${l.quads||0}"/><rect x="52" y="88" width="13" height="40" rx="6" class="lv${l.quads||0}"/>
  <rect x="37" y="132" width="10" height="32" rx="5" class="lv${l.calves||0}"/><rect x="53" y="132" width="10" height="32" rx="5" class="lv${l.calves||0}"/>
</svg>`; }

// back: traps delts lats triceps forearms lowerback glutes hams calves
function back(l) { return `
<svg width="96" height="176" viewBox="0 0 100 185">
  <circle cx="50" cy="15" r="9" class="skin"/>
  <rect x="38" y="25" width="24" height="13" rx="5" class="lv${l.traps||0}"/>
  <ellipse cx="27" cy="43" rx="9" ry="8" class="lv${l.delts||0}"/><ellipse cx="73" cy="43" rx="9" ry="8" class="lv${l.delts||0}"/>
  <rect x="34" y="41" width="15" height="25" rx="5" class="lv${l.lats||0}"/><rect x="51" y="41" width="15" height="25" rx="5" class="lv${l.lats||0}"/>
  <rect x="19" y="53" width="9" height="23" rx="4" class="lv${l.triceps||0}"/><rect x="72" y="53" width="9" height="23" rx="4" class="lv${l.triceps||0}"/>
  <rect x="17" y="78" width="8" height="22" rx="4" class="lv${l.forearms||0}"/><rect x="75" y="78" width="8" height="22" rx="4" class="lv${l.forearms||0}"/>
  <rect x="41" y="68" width="18" height="16" rx="5" class="lv${l.lowerback||0}"/>
  <rect x="36" y="88" width="12" height="15" rx="6" class="lv${l.glutes||0}"/><rect x="52" y="88" width="12" height="15" rx="6" class="lv${l.glutes||0}"/>
  <rect x="35" y="106" width="13" height="26" rx="6" class="lv${l.hams||0}"/><rect x="52" y="106" width="13" height="26" rx="6" class="lv${l.hams||0}"/>
  <rect x="37" y="136" width="10" height="28" rx="5" class="lv${l.calves||0}"/><rect x="53" y="136" width="10" height="28" rx="5" class="lv${l.calves||0}"/>
</svg>`; }

const medal = `<svg class="icn" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
  <path d="M8.5 2 L6 2 L10 9.5 L12.5 8 Z"/><path d="M15.5 2 L18 2 L14 9.5 L11.5 8 Z"/><circle cx="12" cy="16" r="6"/></svg>`;

function phone(o) {
  return `
<div class="phone">
  <div class="top"><button class="ghostBtn">✕</button><div class="clock">${o.clock}</div></div>
  <div class="sum ${o.ramp}">
    <div class="sumTop">
      <div class="sumTitle">Тренировка закончена</div>
      <div class="sumSub">Это твоя ${o.count}-я тренировка</div>
      <div class="sumName">${o.name}</div>
    </div>
    <div class="figures">
      <div>${front(o.f)}<div class="figCap">Перед</div></div>
      <div>${back(o.b)}<div class="figCap">Спина</div></div>
    </div>
    <div class="scale">мало <i class="lv1"></i><i class="lv2"></i><i class="lv3"></i> много</div>
    <div class="nums">
      <div class="num"><div class="numV">${o.time}</div><div class="numL">время</div></div>
      <div class="num"><div class="numV">${o.sets}</div><div class="numL">подходов</div></div>
      <div class="num"><div class="numV">${o.vol}</div><div class="numL">кг</div></div>
    </div>
    ${o.warn ? `<div class="warnBox">${o.warn}</div>` : ``}
    ${o.events ? `<div class="sec"><div class="secTitle">Сегодня впервые</div>${o.events}</div>` : ``}
    <div class="sec"><div class="secTitle">В следующий раз</div><div class="next">${o.next}</div></div>
  </div>
  <div class="sumAct">
    <button class="save">Завершить</button>
    <button class="again">Продолжить тренировку</button>
  </div>
</div>`;
}

const pushDay = {
  clock:"52:07", count:34, name:"UpLow · Верх А",
  time:"52 мин", sets:"18", vol:"4 320",
  f:{ traps:1, delts:2, chest:3, biceps:1, abs:1 },
  b:{ traps:1, delts:2, triceps:3, forearms:1 },
  events: `<div class="ev">${medal}<div><b>Жим лёжа</b> <span>— лучший подход 62.5 × 8</span></div></div>
           <div class="ev"><span class="icn up">▲</span><div><b>Тяга верхнего блока</b> <span>— вес вырос до 55 кг</span></div></div>`,
  next: `<div><b>Жим лёжа 62.5 кг</b> — ты закрыл диапазон во всех подходах</div>
         <div><b>Тяга 55 кг</b> — добей 10 повторов в последнем подходе</div>`,
};

const legDay = {
  clock:"47:31", count:35, name:"UpLow · Низ Б",
  time:"47 мин", sets:"16", vol:"6 180",
  f:{ abs:1, quads:3, calves:2 },
  b:{ lowerback:1, glutes:3, hams:2, calves:2 },
  events: null,
  next: `<div><b>Присед 85 кг</b> — тот же вес, добей 8 повторов во всех подходах</div>
         <div><b>Жим ногами 185 кг</b> — тот же вес</div>`,
};

const partial = {
  clock:"18:44", count:36, name:"UpLow · Верх Б",
  time:"18 мин", sets:"6", vol:"1 240",
  f:{ traps:1, delts:2, chest:1, biceps:2, forearms:1 },
  b:{ traps:2, delts:2, lats:3, triceps:1, forearms:1, lowerback:1 },
  events: null,
  warn: "7 запланированных подходов не сделаны. Они не сохранятся, и в следующий раз веса останутся прежними.",
  next: `<div><b>Жим лёжа 60 кг</b> — тот же вес, что сегодня</div>`,
};

const cards = [
  ["Шкала по яркости", "Ни одного нового цвета на экране. Зелёный остаётся только за кнопкой, как мы и договаривались.", {...pushDay, ramp:"mono"}],
  ["Приглушённая тёплая", "Один новый оттенок, и он нигде больше не используется — значит не с чем перепутать. Чуть живее монохрома.", {...pushDay, ramp:"warm"}],
  ["Как у Hevy", "Бирюза, оранжевый, красный. Видно интенсивность, но экран внезапно становится самым пёстрым местом в приложении.", {...pushDay, ramp:"loud"}],
];

document.write(`<div class="rowTitle">Шкала манекена — один и тот же день, три раскраски</div>`);
for (const [t, note, o] of cards) {
  document.write(`<div class="col"><div class="caption"><b>${t}</b>${note}</div>${phone(o)}</div>`);
}
document.write(`<div class="rowTitle">Остальные состояния — шкала по яркости</div>`);
document.write(`<div class="col"><div class="caption"><b>Обычный день</b>Рекордов нет, блок «сегодня впервые» исчез. «В следующий раз» не пустеет никогда.</div>${phone({...legDay, ramp:"mono"})}</div>`);
document.write(`<div class="col"><div class="caption"><b>Тренировка брошена</b>Предупреждение стоит выше плана: сначала о потере, потом о будущем.</div>${phone({...partial, ramp:"mono"})}</div>`);
</script>
</body>
</html>
